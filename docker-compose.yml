name: compliance-graph

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    restart: unless-stopped
    # neo4j-admin database dump refuses to run against an active logical log;
    # it needs a clean shutdown checkpoint first. Compose's default 10s stop
    # grace period isn't reliably enough time for that on a populated graph --
    # `make dump`/`dump-public` stop neo4j before dumping, and a short grace
    # period leaves the log active and the dump fails.
    stop_grace_period: 120s
    ports:
      - "127.0.0.1:7474:7474"   # Browser: http://localhost:7474
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      CYPHER_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./dumps:/dumps
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$CYPHER_PASSWORD\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: compliance-graph:local
    restart: unless-stopped
    user: "${CG_UID:-1000}:${CG_GID:-1000}"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      CGRAPH_ROOT: /app
    ports:
      - "127.0.0.1:8765:8765"   # MCP (streamable HTTP): http://localhost:8765/mcp
    volumes:
      - ./sources/raw:/app/sources/raw
      - ./out:/app/out
      - ./state:/app/state
    depends_on:
      neo4j:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  neo4j-data:
  neo4j-logs:
  ollama:
